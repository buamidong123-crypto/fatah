<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS KEUN - Platform Hadiah</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Skrip Iklan Adsterra -->
    <script type='text/javascript' src='//pl27745484.revenuecpmgate.com/cc/b3/91/ccb391bc8feb38744d405217744044f6.js'></script>
    <style>
        /* Menggunakan font Inter sebagai default */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- Kontainer utama yang menengahkan konten di layar -->
    <div class="flex flex-col items-center justify-center min-h-screen text-center p-4">

        <!-- Judul Atas -->
        <h2 class="text-2xl font-bold tracking-wider mb-4">
            ALFatah.id
        </h2>

        <!-- Judul Utama -->
        <h1 class="text-7xl md:text-8xl font-black text-blue-500 uppercase tracking-wider mb-6">
            GAS KEUN
        </h1>

        <!-- Tagline/Deskripsi -->
        <div class="bg-gray-800 text-gray-200 text-sm font-medium px-4 py-2 rounded-md mb-10">
            Platform Hadiah Terpercaya
        </div>

        <!-- Tombol Aksi -->
        <button onclick="showAd()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg flex items-center justify-center space-x-3 transition-colors duration-300 shadow-lg shadow-blue-500/30 cursor-pointer">
            <!-- Ikon Play (SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Tonton Iklan untuk Klaim Hadiah</span>
        </button>

    </div>

    <script>
        // Fungsi ini akan dipanggil saat tombol di klik
        function showAd() {
            // Skrip iklan Adsterra biasanya akan mengambil alih tindakan ini
            // untuk menampilkan iklan pop-under atau mengarahkan ke tautan langsung.
            // Membuka tab baru yang kosong adalah pemicu umum agar skrip iklan berjalan.
            const adWindow = window.open('about:blank', '_blank');
            if (!adWindow || adWindow.closed || typeof adWindow.closed == 'undefined') {
                // Memberi tahu pengguna jika pop-up diblokir
                alert("Iklan diblokir oleh browser. Harap izinkan pop-up untuk situs ini.");
            }
        }
    </script>

</body>
</html>
